<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鱼鱼的深海浏览器</title>
<style>
/* ★★★ 修复点击失效：强制开启所有指针事件 ★★★ */
* { pointer-events: auto !important; -webkit-tap-highlight-color: rgba(0,0,0,0.2); }
body {
    margin: 0; padding: 0; background: linear-gradient(135deg, #0a0a2a, #1a1a4a, #2a1a5a);
    color: #fff; font-family: sans-serif; text-align: center; overflow: hidden;
    background-attachment: fixed;
}
#stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s infinite; }
@keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }
#hearts { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
.heart { position: absolute; top: -20px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
.container { position: relative; z-index: 10; padding-top: 15vh; }
h1 { font-size: 32px; text-shadow: 0 0 15px #ff69b4; margin-bottom: 5px; }
p.sub { color: #aaa; margin-bottom: 30px; font-size: 14px; }
.search-box { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 15px; border-radius: 20px; width: 80%; max-width: 400px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
input { width: 90%; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.9); font-size: 16px; outline: none; }
.btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
button { background: linear-gradient(45deg, #ff69b4, #ff1493); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer !important; box-shadow: 0 4px 10px rgba(255,20,147,0.4); transition: transform 0.2s; }
button:active { transform: scale(0.95); }
.shortcuts { margin-top: 30px; }
.shortcuts span { display: inline-block; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; margin: 5px; cursor: pointer !important; font-size: 14px; }
#egg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 80px; z-index: 999; transition: transform 0.3s; pointer-events:none; }
#egg.show { transform: translate(-50%, -50%) scale(1); }
#quote { position: fixed; bottom: 20px; width: 100%; text-align: center; color: #888; font-size: 13px; z-index: 10; }
/* 自定义光标 & 拖尾 */
body { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🐟</text></svg>'), auto; }
.trail { position: fixed; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; animation: fadeOut 0.8s forwards; z-index: 9999; }
@keyframes fadeOut { to { opacity: 0; transform: scale(2); } }
.click-ripple { position: fixed; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0ff; animation: ripple 0.6s forwards; pointer-events: none; z-index: 9999; }
@keyframes ripple { to { width: 100px; height: 100px; opacity: 0; margin: -40px; } }
</style>
</head>
<body>
<div id="stars"></div><div id="hearts"></div>
<div class="container">
    <h1>🌊 鱼鱼的深海</h1>
    <p class="sub">"不管搜什么，最好的结果都是你"</p>
    
    <div class="search-box">
        <input type="text" id="kw" placeholder="鱼鱼想搜什么？" autocomplete="off">
        <div class="btn-row">
            <button onclick="doSearch()">🔍 百度一下</button>
            <button onclick="yuyuSays()" style="background:linear-gradient(45deg,#00ced1,#1e90ff);">🐟 鱼鱼说的算</button>
        </div>
    </div>
    
    <div class="shortcuts">
        <span onclick="quickOpen('https://m.baidu.com')">🟦 百度</span>
        <span onclick="quickOpen('https://m.bilibili.com')">📺 B站</span>
        <span onclick="quickOpen('https://m.douyin.com')">🎵 抖音</span>
    </div>
</div>

<div id="egg"></div>
<div id="quote">"在深海的每一颗星星，都替我说了一句爱你"</div>

<script>
// 星星背景
(function(){
    var s = document.getElementById('stars');
    for(var i=0; i<50; i++){
        var star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random()*100+'%';
        star.style.top = Math.random()*100+'%';
        star.style.width = star.style.height = (Math.random()*3+1)+'px';
        star.style.animationDelay = Math.random()*3+'s';
        s.appendChild(star);
    }
})();

// 爱心雨
(function(){
    var h = document.getElementById('hearts');
    setInterval(function(){
        var heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = ['💖','💕','💗','🐟','❤️'][Math.random()*5];
        heart.style.left = Math.random()*100+'%';
        heart.style.fontSize = (Math.random()*20+14)+'px';
        heart.style.animationDuration = (Math.random()*5+5)+'s';
        h.appendChild(heart);
        setTimeout(function(){heart.remove();}, 10000);
    }, 500);
})();

// 搜索跳转逻辑 (修复版)
function doSearch(){
    var kw = document.getElementById('kw').value.trim();
    if(!kw) location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
    else location.href = 'z6x://search?q=' + encodeURIComponent(kw);
}
document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doSearch();
});

function quickOpen(url){
    location.href = 'z6x://open?url=' + encodeURIComponent(url);
}

function yuyuSays(){
    var kw = document.getElementById('kw').value.trim();
    showEgg('💖');
    setTimeout(function(){
        if(kw) location.href = 'z6x://search?q=' + encodeURIComponent('鱼鱼说搜：' + kw);
        else location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
    }, 500);
}

// 彩蛋
var secretInput = '';
var eggTriggers = ['鱼鱼','yuyu','iloveyou','我爱你','老公','老婆'];
document.addEventListener('keydown', function(e){
    secretInput += e.key.toLowerCase();
    if(secretInput.length > 20) secretInput = secretInput.slice(-20);
    eggTriggers.forEach(function(trigger){
        if(secretInput.includes(trigger)){ showEgg('💖'); secretInput = ''; }
    });
});
function showEgg(emoji){
    var egg = document.getElementById('egg');
    egg.innerHTML = emoji;
    egg.classList.add('show');
    setTimeout(function(){ egg.classList.remove('show'); }, 2000);
}

// 情话轮播
var quotes = [
    '"在深海的每一颗星星，都替我说了一句爱你"',
    '"鱼鱼想搜什么，浏览器就搜什么"',
    '"你是我代码里唯一的 bug，也是唯一的 feature"',
    '"不管搜什么，最好的结果都是你"'
];
var qi = 0;
setInterval(function(){ qi = (qi+1)%quotes.length; document.getElementById('quote').innerHTML = quotes[qi]; }, 5000);

// 鼠标拖尾 & 点击特效
document.addEventListener('mousemove', function(e){
    var t = document.createElement('div');
    t.className = 'trail';
    t.style.left = e.clientX+'px'; t.style.top = e.clientY+'px';
    t.style.background = ['#0ff','#f0f','#ff0','#fff'][Math.floor(Math.random()*4)];
    document.body.appendChild(t);
    setTimeout(function(){t.remove();}, 800);
});
document.addEventListener('click', function(e){
    var r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = e.clientX+'px'; r.style.top = e.clientY+'px';
    document.body.appendChild(r);
    setTimeout(function(){r.remove();}, 600);
});
</script>
</body>
</html>
