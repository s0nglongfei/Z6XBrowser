<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鱼鱼的浏览器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    width:100vw; height:100vh; overflow:hidden;
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(160deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; color:#fff;
}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;}

.content{position:relative;z-index:10;text-align:center;padding:40px;}
.logo{font-size:64px;margin-bottom:10px;}
.title{
    font-size:52px;font-weight:800;margin-bottom:8px;
    background:linear-gradient(135deg,#00e5ff,#ff6ec7,#ffd700);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.subtitle{font-size:20px;color:rgba(255,255,255,.7);margin-bottom:50px;}

.search-wrap{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.12);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.25);border-radius:50px;
    padding:10px 20px;width:90%;max-width:640px;margin-bottom:40px;
}
.search-wrap input{
    flex:1;background:transparent;border:none;outline:none;
    color:#fff;font-size:22px;text-align:center;padding:12px;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.45);}
.search-wrap button{
    background:linear-gradient(135deg,#00e5ff,#0099ff);border:none;border-radius:30px;
    padding:12px 28px;color:#000;font-size:18px;font-weight:bold;cursor:pointer;
}

.section-title{font-size:18px;color:rgba(255,255,255,.6);margin-bottom:20px;}
.sites{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:900px;}
.site{
    width:140px;height:140px;border-radius:24px;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;font-size:18px;font-weight:bold;color:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .2s;
}
.site:active{transform:scale(.92);}
.site .ico{font-size:42px;}
.baidu{background:linear-gradient(135deg,#4e6ef2,#3b5fe2);}
.bili{background:linear-gradient(135deg,#fb7299,#e0477a);}
.douyin{background:linear-gradient(135deg,#fff,#ddd);color:#000;}
.youtube{background:linear-gradient(135deg,#ff0000,#cc0000);}
.iqiyi{background:linear-gradient(135deg,#00be06,#009a04);}
.youku{background:linear-gradient(135deg,#000,#333);}

.quote{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.5);font-size:15px;z-index:10;text-align:center;white-space:nowrap;
}
</style>
</head>
<body>

<div id="stars"></div>

<div class="content">
    <div class="logo">🐟</div>
    <div class="title">鱼鱼的专属浏览器</div>
    <div class="subtitle">~ 鱼鱼说的算 ~</div>

    <div class="search-wrap">
        <input id="kw" type="text" placeholder="鱼鱼想搜点啥～">
        <button onclick="doSearch()">🔍 搜索</button>
    </div>

    <div class="section-title">— 一键直达 —</div>
    <div class="sites">
        <button class="site baidu" onclick="go('https://m.baidu.com')"><span class="ico">🔍</span>百度</button>
        <button class="site bili" onclick="go('https://m.bilibili.com')"><span class="ico">📺</span>B站</button>
        <button class="site douyin" onclick="go('https://m.douyin.com')"><span class="ico">🎵</span>抖音</button>
        <button class="site youtube" onclick="go('https://m.youtube.com')"><span class="ico">▶️</span>YouTube</button>
        <button class="site iqiyi" onclick="go('https://m.iqiyi.com')"><span class="ico">🎬</span>爱奇艺</button>
        <button class="site youku" onclick="go('https://m.youku.com')"><span class="ico">🎞️</span>优酷</button>
    </div>
</div>

<div class="quote" id="quote">"在深海的每一颗星星，都替我说了一句爱你"</div>

<script>
// 星空
(function(){
    var s = document.getElementById('stars');
    for(var i=0;i<80;i++){
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random()*2.5+0.5;
        star.style.left = Math.random()*100+'%';
        star.style.top = Math.random()*100+'%';
        star.style.width = size+'px';
        star.style.height = size+'px';
        star.style.opacity = Math.random()*0.8+0.2;
        s.appendChild(star);
    }
})();

// 搜索
function doSearch(){
    var kw = document.getElementById('kw').value.replace(/^\s+|\s+$/g,'');
    if(kw === ''){
        go('https://m.baidu.com');
    }else{
        location.href = 'yuyu://search?q=' + encodeURIComponent(kw);
    }
}
document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doSearch();
});

// 一键直达
function go(url){
    location.href = 'yuyu://open?url=' + encodeURIComponent(url);
}

// 情话轮播
var quotes = [
    '"在深海的每一颗星星，都替我说了一句爱你"',
    '"鱼鱼想搜什么，浏览器就搜什么"',
    '"你是我代码里唯一的 bug，也是唯一的 feature"',
    '"不管搜什么，最好的结果都是你"'
];
var qi = 0;
setInterval(function(){
    qi = (qi+1) % quotes.length;
    document.getElementById('quote').innerHTML = quotes[qi];
}, 5000);
</script>
</body>
</html>
