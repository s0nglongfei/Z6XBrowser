<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鱼鱼的专属浏览器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    width:100vw; height:100vh; overflow:hidden;
    font-family:'Microsoft YaHei',sans-serif;
    background:linear-gradient(180deg,#0a0e27 0%,#1a1b4b 30%,#0d2149 60%,#0a1628 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.heart-fall{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.title{
    font-size:52px;font-weight:bold;z-index:10;margin-bottom:10px;
    background:linear-gradient(135deg,#00e5ff,#ff6699,#ffd700);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 30px rgba(0,229,255,.3);
}
.subtitle{font-size:18px;color:rgba(255,255,255,.7);z-index:10;margin-bottom:40px;}
.search-box{
    z-index:10;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:8px 20px;
    display:flex;align-items:center;width:70%;max-width:600px;margin-bottom:24px;
}
.search-box input{
    flex:1;background:transparent;border:none;outline:none;color:#fff;
    font-size:22px;padding:12px 16px;text-align:center;
}
.search-box input::placeholder{color:rgba(255,255,255,.4);}
.search-btn{
    background:linear-gradient(135deg,#00e5ff,#0099ff);border:none;border-radius:30px;
    padding:10px 24px;color:#000;font-size:18px;font-weight:bold;cursor:pointer;
}
.quick-bar{z-index:10;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.quick-btn{border:none;border-radius:25px;padding:10px 22px;font-size:16px;font-weight:bold;cursor:pointer;}
.btn-baidu{background:linear-gradient(135deg,#00e5ff,#0099ff);color:#000;}
.btn-bili{background:linear-gradient(135deg,#ff6699,#ff3366);color:#fff;}
.btn-douyin{background:linear-gradient(135deg,#fff,#ddd);color:#000;}
.btn-yuyu{background:linear-gradient(135deg,#ff69b4,#ff1493);color:#fff;}
.love-quote{
    position:fixed;bottom:5%;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.6);font-size:14px;z-index:10;text-align:center;max-width:80%;
}
.easter-egg{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-size:80px;z-index:999;pointer-events:none;transition:transform .5s;
}
.easter-egg.show{transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="heart-fall" id="hearts"></div>

<div class="title">🐟 鱼鱼的专属浏览器</div>
<div class="subtitle">~ 鱼鱼说的算 ~</div>

<div class="search-box">
    <input id="kw" type="text" placeholder="鱼鱼想搜点啥～">
    <button class="search-btn" onclick="doSearch()">🔍 搜索</button>
</div>

<div class="quick-bar">
    <button class="quick-btn btn-baidu" onclick="quickOpen('https://m.baidu.com')">🔍 百度</button>
    <button class="quick-btn btn-bili" onclick="quickOpen('https://m.bilibili.com')">📺 B站</button>
    <button class="quick-btn btn-douyin" onclick="quickOpen('https://www.douyin.com')">🎵 抖音</button>
    <button class="quick-btn btn-yuyu" onclick="yuyuSays()">💖 鱼鱼说的算</button>
</div>

<div class="easter-egg" id="egg">💖</div>
<div class="love-quote" id="quote">"在深海的每一颗星星，都替我说了一句爱你"</div>

<script>
// ===== 星空：变量名统一用 star，不再报错 =====
(function(){
    var s = document.getElementById('stars');
    var i = 0;
    for(i=0;i<60;i=i+1){
        var star = document.createElement('div');
        star.style.position = 'absolute';
        star.style.left = Math.random()*100 + '%';
        star.style.top = Math.random()*100 + '%';
        star.style.width = '2px';
        star.style.height = '2px';
        star.style.background = '#fff';
        star.style.borderRadius = '50%';
        star.style.opacity = Math.random() + '';
        s.appendChild(star);
    }
})();

// ===== 爱心雨 =====
(function(){
    var h = document.getElementById('hearts');
    function dropHeart(){
        var heart = document.createElement('div');
        heart.style.position = 'absolute';
        heart.style.top = '-30px';
        heart.style.left = Math.random()*100 + '%';
        heart.style.fontSize = (Math.random()*20+14) + 'px';
        var symbols = ['💖','💕','💗','🐟','❤️'];
        heart.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
        var dur = (Math.random()*5+5);
        heart.style.animation = 'fall ' + dur + 's linear forwards';
        h.appendChild(heart);
        setTimeout(function(){ heart.remove(); }, dur*1000);
    }
    setInterval(dropHeart, 500);
})();

// ===== 搜索跳转 =====
function doSearch(){
    var input = document.getElementById('kw');
    var kw = input.value;
    kw = kw.replace(/^\s+|\s+$/g, '');
    if(kw === ''){
        location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
    }else{
        location.href = 'z6x://search?q=' + encodeURIComponent(kw);
    }
}
document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ doSearch(); }
});

function quickOpen(url){
    location.href = 'z6x://open?url=' + encodeURIComponent(url);
}

function yuyuSays(){
    var input = document.getElementById('kw');
    var kw = input.value;
    kw = kw.replace(/^\s+|\s+$/g, '');
    showEgg('💖');
    setTimeout(function(){
        if(kw !== ''){
            location.href = 'z6x://search?q=' + encodeURIComponent('鱼鱼说搜：' + kw);
        }else{
            location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
        }
    }, 500);
}

// ===== 彩蛋 =====
var secretInput = '';
var triggers = ['鱼鱼','yuyu','iloveyou','我爱你','老公','老婆'];
document.addEventListener('keydown', function(e){
    secretInput = secretInput + e.key.toLowerCase();
    if(secretInput.length > 20){ secretInput = secretInput.substr(-20); }
    for(var t=0; t<triggers.length; t=t+1){
        if(secretInput.indexOf(triggers[t]) >= 0){
            showEgg('💖');
            secretInput = '';
            break;
        }
    }
});
function showEgg(emoji){
    var egg = document.getElementById('egg');
    egg.innerHTML = emoji;
    egg.classList.add('show');
    setTimeout(function(){ egg.classList.remove('show'); }, 2000);
}

// ===== 情话轮播 =====
var quotes = [
    '"在深海的每一颗星星，都替我说了一句爱你"',
    '"鱼鱼想搜什么，浏览器就搜什么"',
    '"你是我代码里唯一的 bug，也是唯一的 feature"',
    '"不管搜什么，最好的结果都是你"',
    '"今天的风是甜的，因为你说了算"'
];
var qi = 0;
setInterval(function(){
    qi = qi + 1;
    if(qi >= quotes.length){ qi = 0; }
    document.getElementById('quote').innerHTML = quotes[qi];
}, 5000);
</script>
<style>
@keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
}
</style>
</body>
</html>
