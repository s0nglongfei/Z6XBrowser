<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鱼鱼的浏览器</title>
<style>
    body { margin:0; padding:0; background: linear-gradient(135deg, #0a0a2a, #1a1a4a, #2a1a5a); color:#fff; font-family: sans-serif; overflow:hidden; }
    .container { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; position:relative; z-index:10; }
    .title { font-size:32px; margin-bottom:20px; text-shadow:0 0 10px #0ff; }
    .search-box { display:flex; gap:10px; background:rgba(255,255,255,0.1); padding:15px; border-radius:30px; backdrop-filter:blur(10px); box-shadow:0 0 20px rgba(0,255,255,0.2); }
    input { background:transparent; border:none; outline:none; color:#fff; font-size:18px; width:250px; padding:5px 15px; }
    button { background:linear-gradient(45deg, #f0f, #0ff); border:none; padding:10px 20px; border-radius:20px; color:#fff; font-size:16px; cursor:pointer; box-shadow:0 0 10px rgba(255,0,255,0.5); }
    .quick-links { margin-top:30px; display:flex; gap:15px; }
    .qbtn { background:rgba(255,255,255,0.2); padding:10px 20px; border-radius:20px; cursor:pointer; font-size:14px; }
    .yuyu-btn { margin-top:20px; background:linear-gradient(45deg, #ff69b4, #ff1493); padding:12px 30px; border-radius:30px; cursor:pointer; font-size:18px; box-shadow:0 0 15px #ff69b4; }
    .quote { margin-top:40px; font-size:16px; color:#aaa; font-style:italic; }
    #egg { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:80px; transition:0.3s; z-index:999; }
    #egg.show { transform:translate(-50%,-50%) scale(1); }
    .star { position:fixed; background:#fff; border-radius:50%; animation:twinkle 3s infinite; z-index:1; }
    @keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }
    .heart { position:fixed; top:-50px; animation:fall linear forwards; z-index:2; }
    @keyframes fall { to{transform:translateY(110vh) rotate(360deg); opacity:0;} }
    /* 鼠标拖尾 & 点击 */
    .trail { position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; animation:fade 0.8s forwards; z-index:999; }
    @keyframes fade { to{opacity:0; transform:scale(2);} }
    .click-ripple { position:fixed; width:10px; height:10px; border-radius:50%; border:2px solid #0ff; transform:translate(-50%,-50%); pointer-events:none; animation:ripple 0.6s forwards; z-index:999; }
    @keyframes ripple { to{width:100px; height:100px; opacity:0;} }
    /* 自定义光标 */
    body { cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100"><text y=".9em" font-size="90">🐟</text></svg>'), auto; }
</style>
</head>
<body>
<div id="stars"></div>
<div id="hearts"></div>
<div class="container">
    <div class="title">🐟 鱼鱼的专属浏览器 💖</div>
    <div class="search-box">
        <input type="text" id="kw" placeholder="想搜点什么...">
        <button onclick="doSearch()">搜索</button>
    </div>
    <div class="quick-links">
        <div class="qbtn" onclick="quickOpen('https://m.baidu.com')">百度</div>
        <div class="qbtn" onclick="quickOpen('https://m.bilibili.com')">B站</div>
        <div class="qbtn" onclick="quickOpen('https://www.douyin.com')">抖音</div>
    </div>
    <div class="yuyu-btn" onclick="yuyuSays()">✨ 鱼鱼说的算 ✨</div>
    <div class="quote" id="quote">"在深海的每一颗星星，都替我说了一句爱你"</div>
</div>
<div id="egg"></div>

<script>
// 星空
(function(){
    var s = document.getElementById('stars');
    for(var i=0; i<50; i++){
        var star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random()*100+'%';
        star.style.top = Math.random()*100+'%';
        star.style.width = star.style.height = (Math.random()*3+1)+'px';
        star.style.animationDelay = Math.random()*3+'s';
        s.appendChild(star);
    }
})();

// 爱心雨
(function(){
    var h = document.getElementById('hearts');
    setInterval(function(){
        var heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = ['💖','💕','💗','🐟','❤️'][Math.random()*5];
        heart.style.left = Math.random()*100+'%';
        heart.style.fontSize = (Math.random()*20+14)+'px';
        heart.style.animationDuration = (Math.random()*5+5)+'s';
        h.appendChild(heart);
        setTimeout(function(){heart.remove();}, 10000);
    }, 500);
})();

// 搜索跳转
function doSearch(){
    var kw = document.getElementById('kw').value.trim();
    if(!kw) location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
    else location.href = 'z6x://search?q=' + encodeURIComponent(kw);
}
document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doSearch();
});

function quickOpen(url){
    location.href = 'z6x://open?url=' + encodeURIComponent(url);
}

function yuyuSays(){
    var kw = document.getElementById('kw').value.trim();
    showEgg('💖');
    setTimeout(function(){
        if(kw) location.href = 'z6x://search?q=' + encodeURIComponent('鱼鱼说搜：' + kw);
        else location.href = 'z6x://open?url=' + encodeURIComponent('https://m.baidu.com');
    }, 500);
}

// 彩蛋
var secretInput = '';
var eggTriggers = ['鱼鱼','yuyu','iloveyou','我爱你','老公','老婆'];
document.addEventListener('keydown', function(e){
    secretInput += e.key.toLowerCase();
    if(secretInput.length > 20) secretInput = secretInput.slice(-20);
    eggTriggers.forEach(function(trigger){
        if(secretInput.includes(trigger)){ showEgg('💖'); secretInput = ''; }
    });
});
function showEgg(emoji){
    var egg = document.getElementById('egg');
    egg.innerHTML = emoji;
    egg.classList.add('show');
    setTimeout(function(){ egg.classList.remove('show'); }, 2000);
}

// 情话轮播
var quotes = [
    '"在深海的每一颗星星，都替我说了一句爱你"',
    '"鱼鱼想搜什么，浏览器就搜什么"',
    '"你是我代码里唯一的 bug，也是唯一的 feature"',
    '"不管搜什么，最好的结果都是你"'
];
var qi = 0;
setInterval(function(){ qi = (qi+1)%quotes.length; document.getElementById('quote').innerHTML = quotes[qi]; }, 5000);

// 鼠标拖尾 & 点击特效
document.addEventListener('mousemove', function(e){
    var t = document.createElement('div');
    t.className = 'trail';
    t.style.left = e.clientX+'px'; t.style.top = e.clientY+'px';
    t.style.background = ['#0ff','#f0f','#ff0','#fff'][Math.random()*4];
    document.body.appendChild(t);
    setTimeout(function(){t.remove();}, 800);
});
document.addEventListener('click', function(e){
    var r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = e.clientX+'px'; r.style.top = e.clientY+'px';
    document.body.appendChild(r);
    setTimeout(function(){r.remove();}, 600);
});
</script>
</body>
</html>
